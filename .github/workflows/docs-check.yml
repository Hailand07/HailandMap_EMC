name: Contrôle de documentation
on:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la cohérence code / documentation
        run: node scripts/check-docs.mjs --base origin/${{ github.base_ref }}
